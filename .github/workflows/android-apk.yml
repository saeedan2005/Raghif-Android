name: Build Raghif Android APK

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build and test Android app
    runs-on: ubuntu-latest
    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Configure Android SDK path
        run: |
          echo "$ANDROID_HOME/cmdline-tools/latest/bin" >> "$GITHUB_PATH"
          echo "$ANDROID_HOME/platform-tools" >> "$GITHUB_PATH"
          if [ ! -x "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" ]; then
            echo "sdkmanager was not found under $ANDROID_HOME/cmdline-tools/latest/bin"
            find "$ANDROID_HOME/cmdline-tools" -maxdepth 3 -name sdkmanager -type f || true
            exit 1
          fi

      - name: Accept SDK licenses and install required packages
        run: |
          yes | sdkmanager --licenses
          sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Install Gradle 8.9
        run: |
          curl -fL --retry 5 --retry-all-errors --retry-delay 5 --connect-timeout 20 \
            https://services.gradle.org/distributions/gradle-8.9-bin.zip -o /tmp/gradle.zip
          unzip -q /tmp/gradle.zip -d /opt
          echo "/opt/gradle-8.9/bin" >> "$GITHUB_PATH"

      - name: Prepare original borderless launcher icon
        run: |
          python3 -m pip install --disable-pip-version-check --quiet Pillow==11.3.0
          python3 scripts/prepare_launcher_icon.py

      - name: Verify original image aspect-ratio safeguards
        run: python3 scripts/validate_image_usage.py

      - name: Verify review notes and unchanged accounting formulas
        run: python3 scripts/validate_review_requirements.py

      - name: Run unit tests
        run: gradle testDebugUnitTest --stacktrace

      - name: Build debug APK
        run: gradle assembleDebug --stacktrace

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: Raghif-Debug-APK
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
